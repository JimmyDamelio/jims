<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Jimmy Décrypte — Valider pour annuler</title>
<style>
@font-face{font-family:SG;src:url(fonts/spacegrotesk-700.woff2);font-weight:700}
@font-face{font-family:SG;src:url(fonts/spacegrotesk-500.woff2);font-weight:500}
@font-face{font-family:IN;src:url(fonts/inter-400.woff2);font-weight:400}
@font-face{font-family:IN;src:url(fonts/inter-600.woff2);font-weight:600}
@font-face{font-family:IN;src:url(fonts/inter-800.woff2);font-weight:800}
html,body{margin:0;background:#071B3A}canvas{display:block;width:540px;height:960px}
</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script src="timeline.js"></script>
<script>
const W = 1080, H = 1920, c = document.getElementById('c'), x = c.getContext('2d');
const NIGHT = '#071B3A', BLUE = '#1261D8', LIGHT = '#35A7FF', WHITE = '#FFFFFF', ICE = '#EAF4FF', DANGER = '#FF5468', OK = '#22C97A';

// ---------- maths ----------
const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const pr = (t, a, b) => cl((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const eo = k => 1 - Math.pow(1 - k, 4);                 // entrance (ease-out quart)
const ei = k => k * k * k;                              // exit
const eio = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const back = k => { const s = 1.70158; k -= 1; return k * k * ((s + 1) * k + s) + 1; };
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = n => { const r = mulberry(n * 7919 + 13); return r(); };
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; };
// in/out envelope: fades in over [a,a+fi], out over [b-fo,b]
const env = (t, a, b, fi = .35, fo = .3) => Math.min(eo(pr(t, a, a + fi)), 1 - ei(pr(t, b - fo, b)));

// ---------- drawing helpers (all multiply current globalAlpha) ----------
function rr(X, Y, w, h, r) { x.beginPath(); x.roundRect(X, Y, w, h, r); }
function alpha(a, fn) { x.save(); x.globalAlpha *= a; fn(); x.restore(); }
function font(size, w = 700, fam = 'SG') { x.font = `${w} ${size}px ${fam}`; }
function txt(s, X, Y, size, col = WHITE, w = 700, fam = 'SG', align = 'center', ls = 0) {
  font(size, w, fam); x.fillStyle = col; x.textAlign = align; x.textBaseline = 'middle';
  x.letterSpacing = ls + 'px'; x.fillText(s, X, Y); x.letterSpacing = '0px';
}
function wrap(s, maxW, size, w, fam) { font(size, w, fam); const out = []; let line = '';
  for (const word of s.split(' ')) { const t = line ? line + ' ' + word : word; if (x.measureText(t).width > maxW && line) { out.push(line); line = word; } else line = t; }
  out.push(line); return out; }
const GL = 'ABCDEF0123456789#$%&@*<>/\\=+';
function scramble(s, k, seed) { // decrypt effect: chars resolve left to right
  const n = s.length, done = Math.floor(k * (n + 4)); let o = '';
  for (let i = 0; i < n; i++) { if (s[i] === ' ' || i < done - 4) o += s[i]; else if (i < done) o += GL[Math.floor(hash(seed + i * 31) * GL.length)]; else o += k > 0 ? GL[Math.floor(hash(seed * 3 + i) * GL.length)] : ' '; }
  return o; }
// kinetic line: words rise + unblur with stagger
function kinetic(s, X, Y, size, t, t0, col = WHITE, opts = {}) {
  const words = s.split(' '), w = opts.w || 700, fam = opts.fam || 'SG'; font(size, w, fam);
  const sp = x.measureText(' ').width, widths = words.map(q => x.measureText(q).width);
  const total = widths.reduce((a, b) => a + b, 0) + sp * (words.length - 1);
  let cx = X - total / 2; const out = opts.out ? 1 - ei(pr(t, opts.out - .3, opts.out)) : 1;
  words.forEach((q, i) => {
    const k = eo(pr(t, t0 + i * .07, t0 + i * .07 + .45));
    if (k > 0) alpha(k * out, () => {
      x.filter = k < 1 ? `blur(${(1 - k) * 10}px)` : 'none';
      const hl = opts.hl && opts.hl.includes(i);
      txt(q, cx + widths[i] / 2, Y + (1 - k) * 46, size, hl ? LIGHT : col, w, fam);
      if (hl && opts.under) { const u = eo(pr(t, t0 + i * .07 + .3, t0 + i * .07 + .8)); x.fillStyle = LIGHT; x.fillRect(cx, Y + size * .58, widths[i] * u, 7); }
      x.filter = 'none';
    });
    cx += widths[i] + sp;
  });
}

// ---------- background: depth grid, particles, light lines ----------
const rnd = mulberry(42);
const PARTS = Array.from({ length: 90 }, () => ({ x: rnd() * W, y: rnd() * H, z: .2 + rnd() * .9, s: rnd() * 6.28, r: .8 + rnd() * 2.6 }));
function background(t, cam) {
  const g = x.createRadialGradient(W / 2, H * .45, 50, W / 2, H * .5, H * .85);
  g.addColorStop(0, '#0D2E63'); g.addColorStop(.55, NIGHT); g.addColorStop(1, '#040F22');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  // perspective floor grid (drifts toward camera)
  x.save(); x.strokeStyle = rgba(LIGHT, .09); x.lineWidth = 2;
  const hz = 1180 - cam.y * .15, vx = W / 2 - cam.x * .3;
  for (let i = -14; i <= 14; i++) { x.beginPath(); x.moveTo(vx + i * 22, hz); x.lineTo(vx + i * 260, H + 200); x.stroke(); }
  for (let j = 0; j < 14; j++) { const d = ((j + (t * .35) % 1) / 14); const y = hz + Math.pow(d, 2.2) * (H - hz + 200);
    x.globalAlpha = d; x.beginPath(); x.moveTo(0, y); x.lineTo(W, y); x.stroke(); }
  x.restore();
  const hg = x.createLinearGradient(0, hz - 260, 0, hz + 60); hg.addColorStop(0, rgba(NIGHT, 0)); hg.addColorStop(.8, rgba(NIGHT, .95)); hg.addColorStop(1, rgba(NIGHT, 0));
  x.fillStyle = hg; x.fillRect(0, hz - 260, W, 320);
  // particles with parallax
  for (const p of PARTS) {
    const px = ((p.x - cam.x * p.z * .6 + Math.sin(t * .3 + p.s) * 20) % W + W) % W;
    const py = ((p.y - cam.y * p.z * .6 - t * 18 * p.z) % H + H) % H;
    x.fillStyle = rgba(p.z > .8 ? WHITE : LIGHT, .15 + .35 * p.z * (.6 + .4 * Math.sin(t * 2 + p.s)));
    x.beginPath(); x.arc(px, py, p.r * p.z * (cam.z || 1), 0, 6.28); x.fill();
  }
}
// diagonal light streaks used as transitions
function streaks(t, t0, n = 5) {
  const k = pr(t, t0 - .35, t0 + .45); if (k <= 0 || k >= 1) return;
  x.save(); x.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i++) {
    const off = (hash(t0 * 100 + i) - .5) * 900, w = 6 + hash(i + t0) * 40, kk = eio(cl(k * 1.3 - i * .06));
    const cx = lerp(-700, W + 700, kk) + off * .3;
    const g = x.createLinearGradient(cx - 400, 0, cx + 400, 0);
    g.addColorStop(0, rgba(LIGHT, 0)); g.addColorStop(.5, rgba(i % 2 ? WHITE : LIGHT, .55)); g.addColorStop(1, rgba(LIGHT, 0));
    x.fillStyle = g; x.translate(W / 2, H / 2); x.rotate(-.42); x.fillRect(cx - W / 2 - 400, -1600 + off, 800, w); x.setTransform(1, 0, 0, 1, 0, 0);
  }
  x.restore();
}
function flash(t, t0, d = .25, a = .5, col = WHITE) { const k = pr(t, t0, t0 + d); if (k > 0 && k < 1) { x.fillStyle = rgba(col, a * (1 - k)); x.fillRect(0, 0, W, H); } }

// ---------- icons ----------
function bankIcon(X, Y, s, col) { x.save(); x.translate(X, Y); x.scale(s, s); x.fillStyle = col;
  x.beginPath(); x.moveTo(-40, -12); x.lineTo(0, -38); x.lineTo(40, -12); x.closePath(); x.fill();
  for (let i = -3; i <= 3; i += 2) x.fillRect(i * 10 - 4, -6, 8, 34); x.fillRect(-42, 30, 84, 8); x.restore(); }
function handset(X, Y, s, col, rot = 0) { x.save(); x.translate(X, Y); x.rotate(rot); x.scale(s, s); x.strokeStyle = col; x.lineWidth = 9; x.lineCap = 'round';
  x.beginPath(); x.arc(0, 8, 22, Math.PI * 1.05, Math.PI * 1.95); x.stroke(); x.fillStyle = col; rr(-30, -2, 14, 16, 5); x.fill(); rr(16, -2, 14, 16, 5); x.fill(); x.restore(); }
function cross(X, Y, r, k, col) { x.save(); x.strokeStyle = col; x.lineWidth = 8; x.lineCap = 'round'; const a = cl(k * 2), b = cl(k * 2 - 1);
  x.beginPath(); x.moveTo(X - r, Y - r); x.lineTo(X - r + 2 * r * a, Y - r + 2 * r * a); x.stroke();
  if (b > 0) { x.beginPath(); x.moveTo(X + r, Y - r); x.lineTo(X + r - 2 * r * b, Y - r + 2 * r * b); x.stroke(); } x.restore(); }
function check(X, Y, r, k, col) { x.save(); x.strokeStyle = col; x.lineWidth = 9; x.lineCap = 'round'; x.lineJoin = 'round';
  x.beginPath(); x.moveTo(X - r, Y); const a = cl(k * 2.5); x.lineTo(X - r + r * .7 * a, Y + r * .7 * a);
  const b = cl(k * 1.6 - .5); if (b > 0) x.lineTo(X - r * .3 + r * 1.3 * b, Y + r * .7 - r * 1.5 * b); x.stroke(); x.restore(); }

// ---------- phone ----------
const PW = 480, PH = 980, PX = 540, PY = 1080;
function phone(t, screen, o = {}) {
  const s = o.s ?? 1, tilt = o.tilt ?? 0, dx = o.dx ?? 0, dy = o.dy ?? 0;
  x.save(); x.translate(PX + dx, PY + dy); x.rotate(o.rot ?? 0);
  x.transform(Math.cos(tilt), Math.sin(tilt) * .18, 0, 1, 0, 0); x.scale(s, s);
  // glow + shadow
  x.shadowColor = rgba(LIGHT, .35); x.shadowBlur = 90; x.fillStyle = '#081733'; rr(-PW / 2, -PH / 2, PW, PH, 74); x.fill(); x.shadowBlur = 0;
  const rim = x.createLinearGradient(-PW / 2, -PH / 2, PW / 2, PH / 2); rim.addColorStop(0, rgba(LIGHT, .9)); rim.addColorStop(.5, rgba(BLUE, .3)); rim.addColorStop(1, rgba(LIGHT, .7));
  x.strokeStyle = rim; x.lineWidth = 4; rr(-PW / 2, -PH / 2, PW, PH, 74); x.stroke();
  // screen
  x.save(); rr(-PW / 2 + 16, -PH / 2 + 16, PW - 32, PH - 32, 60); x.clip();
  x.translate(-PW / 2 + 16, -PH / 2 + 16); screen(t, PW - 32, PH - 32);
  x.restore();
  x.fillStyle = '#000'; rr(-70, -PH / 2 + 34, 140, 40, 20); x.fill(); // island
  // glass reflection sweep
  const gx = ((t * .25) % 1.6 - .3) * PW * 2 - PW;
  const rg = x.createLinearGradient(gx - 120, -PH / 2, gx + 120, PH / 2); rg.addColorStop(0, rgba(WHITE, 0)); rg.addColorStop(.5, rgba(WHITE, .05)); rg.addColorStop(1, rgba(WHITE, 0));
  x.fillStyle = rg; rr(-PW / 2 + 16, -PH / 2 + 16, PW - 32, PH - 32, 60); x.fill();
  x.restore();
}
function screenBg(w, h, top = '#0F3470') { const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, top); g.addColorStop(1, '#06162F'); x.fillStyle = g; x.fillRect(0, 0, w, h); }
function statusBar(w, clock = '21:47') { txt(clock, 64, 52, 26, WHITE, 600, 'IN'); x.fillStyle = WHITE; for (let i = 0; i < 4; i++) x.fillRect(w - 128 + i * 9, 58 - i * 5, 6, 6 + i * 5); rr(w - 82, 42, 40, 20, 5); x.fill(); }
function callHeader(w, sub) {
  x.fillStyle = rgba(LIGHT, .16); x.beginPath(); x.arc(w / 2, 270, 92, 0, 6.28); x.fill();
  x.strokeStyle = rgba(LIGHT, .6); x.lineWidth = 3; x.stroke(); bankIcon(w / 2, 272, 1.2, ICE);
  txt('Service Fraude', w / 2, 420, 46, WHITE, 700, 'SG'); txt('Ta Banque', w / 2, 470, 30, rgba(ICE, .75), 400, 'IN'); txt(sub, w / 2, 520, 26, rgba(LIGHT, .9), 600, 'IN');
}
function scrIncoming(t, w, h) {
  screenBg(w, h); statusBar(w);
  for (let i = 0; i < 3; i++) { const k = ((t * .8 + i / 3) % 1); x.strokeStyle = rgba(LIGHT, .5 * (1 - k)); x.lineWidth = 3; x.beginPath(); x.arc(w / 2, 270, 92 + k * 120, 0, 6.28); x.stroke(); }
  callHeader(w, 'appel entrant…');
  const pressed = pr(t, T.accept - .1, T.accept + .15);
  x.fillStyle = DANGER; x.beginPath(); x.arc(w * .27, h - 170, 58, 0, 6.28); x.fill(); handset(w * .27, h - 170, 1, WHITE, 2.36);
  const pulse = 1 + .07 * Math.sin(t * 9) * (1 - pressed);
  x.fillStyle = OK; x.beginPath(); x.arc(w * .73, h - 170, 58 * pulse * (1 - .12 * Math.sin(pressed * Math.PI)), 0, 6.28); x.fill(); handset(w * .73, h - 170, 1, WHITE);
  txt('Refuser', w * .27, h - 80, 24, rgba(ICE, .7), 400, 'IN'); txt('Accepter', w * .73, h - 80, 24, rgba(ICE, .7), 400, 'IN');
}
function timer(t, t0) { const s = Math.max(0, Math.floor((t - t0) * 1 + 1)); return `00:${String(s).padStart(2, '0')}`; }
function scrCall(t, w, h, o = {}) {
  screenBg(w, h); statusBar(w); callHeader(w, o.ended ? 'appel terminé' : timer(t, T.accept));
  if (!o.ended) { // voice activity, drawn (no voice in the soundtrack)
    for (let i = 0; i < 17; i++) { const a = .5 + .5 * Math.sin(t * 13 + i * 1.7) * Math.sin(t * 5.3 + i * .6); const bh = 8 + 60 * a * a;
      x.fillStyle = rgba(LIGHT, .85); rr(w / 2 - 170 + i * 21, 610 - bh / 2, 11, bh, 6); x.fill(); }
  }
  const labels = ['muet', 'clavier', 'HP', 'ajouter', 'FaceTime', 'contacts'];
  labels.forEach((l, i) => { const cx = w / 2 + ((i % 3) - 1) * 130, cy = 740 + Math.floor(i / 3) * 140;
    x.fillStyle = rgba(WHITE, .1); x.beginPath(); x.arc(cx, cy, 46, 0, 6.28); x.fill(); x.fillStyle = rgba(WHITE, .55); x.beginPath(); x.arc(cx, cy, 9, 0, 6.28); x.fill();
    txt(l, cx, cy + 68, 20, rgba(ICE, .6), 400, 'IN'); });
  const hp = o.hang ? pr(t, o.hang - .1, o.hang + .2) : 0;
  if (!o.ended) { x.fillStyle = DANGER; x.beginPath(); x.arc(w / 2, h - 150, 58 * (1 - .14 * Math.sin(hp * Math.PI)), 0, 6.28); x.fill(); handset(w / 2, h - 150, 1, WHITE, 2.36); }
  else { x.fillStyle = rgba(WHITE, .08); rr(40, h - 210, w - 80, 110, 30); x.fill(); txt('Tu as raccroché.', w / 2, h - 155, 30, WHITE, 600, 'IN'); }
}
function notif(t, w, t0) {
  const k = eo(pr(t, t0, t0 + .5)), y = lerp(-180, 90, k) - 220 * ei(pr(t, T.tapNotif, T.tapNotif + .25));
  if (k <= 0) return;
  x.save(); x.shadowColor = 'rgba(0,0,0,.4)'; x.shadowBlur = 30; x.fillStyle = rgba(ICE, .96); rr(18, y, w - 36, 150, 34); x.fill(); x.restore();
  x.fillStyle = BLUE; rr(42, y + 28, 64, 64, 16); x.fill(); bankIcon(74, y + 62, .52, WHITE);
  txt('TA BANQUE', 128, y + 42, 20, rgba(NIGHT, .6), 600, 'IN', 'left', 1.5); txt('maintenant', w - 44, y + 42, 20, rgba(NIGHT, .5), 400, 'IN', 'right');
  txt('Opération à confirmer', 128, y + 78, 28, NIGHT, 800, 'IN', 'left'); txt('Ouvre l’appli pour la vérifier.', 128, y + 114, 24, rgba(NIGHT, .75), 400, 'IN', 'left');
}
function money(v) { return v.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' €'; }
function scrApp(t, w, h, o = {}) {
  x.fillStyle = ICE; x.fillRect(0, 0, w, h); statusBar(w); x.fillStyle = NIGHT; x.globalAlpha *= 1;
  x.fillStyle = BLUE; x.fillRect(0, 0, w, 210); statusBar(w); bankIcon(70, 140, .55, WHITE); txt('Ta Banque', 110, 140, 32, WHITE, 700, 'SG', 'left');
  txt('Confirmation requise', w / 2, 290, 30, rgba(NIGHT, .65), 600, 'IN');
  const v = 1890 * eio(pr(t, T.count, T.countEnd));
  txt(money(v), w / 2, 380, 78, NIGHT, 800, 'IN');
  txt('Paiement en ligne', w / 2, 455, 30, BLUE, 600, 'IN');
  const rows = [['Bénéficiaire', 'SHOP-XR77'], ['Date', 'aujourd’hui, 21:48'], ['Moyen', 'Carte •••• 4021']];
  rows.forEach(([a, b], i) => { const y = 540 + i * 74; x.fillStyle = rgba(NIGHT, .08); x.fillRect(40, y + 36, w - 80, 2);
    txt(a, 44, y, 26, rgba(NIGHT, .55), 400, 'IN', 'left'); txt(b, w - 44, y, 26, NIGHT, 600, 'IN', 'right'); });
  // validate button
  const by = h - 250, bp = o.press ? pr(t, o.press, o.press + .2) : 0;
  x.save(); x.translate(w / 2, by + 50); x.scale(1 - .05 * Math.sin(bp * Math.PI), 1 - .05 * Math.sin(bp * Math.PI));
  x.shadowColor = rgba(BLUE, .5); x.shadowBlur = 30; x.fillStyle = o.btnCol || BLUE; rr(-(w - 80) / 2, -50, w - 80, 100, 50); x.fill(); x.shadowBlur = 0;
  txt(o.label || 'Valider', 0, 2, 40, WHITE, 800, 'IN'); x.restore();
  txt('Refuser', w / 2, h - 110, 28, rgba(NIGHT, .55), 600, 'IN');
}
// transcript bubble (what the caller says — shown as text, never voiced)
function bubble(t, t0, s, y, out) {
  const k = back(cl(pr(t, t0, t0 + .45))), a = env(t, t0, out, .25, .35); if (a <= 0) return;
  const lines = wrap(s, 760, 44, 600, 'IN'), bh = 110 + lines.length * 56;
  alpha(a, () => { x.save(); x.translate(540, y + bh / 2); x.scale(.85 + .15 * k, .85 + .15 * k); x.translate(-540, -(y + bh / 2));
    x.shadowColor = 'rgba(0,0,0,.45)'; x.shadowBlur = 50; x.fillStyle = WHITE; rr(90, y, 900, bh, 40); x.fill(); x.shadowBlur = 0;
    x.beginPath(); x.moveTo(150, y + bh - 2); x.lineTo(130, y + bh + 34); x.lineTo(210, y + bh - 2); x.fill();
    for (let i = 0; i < 5; i++) { const bb = 8 + 18 * Math.abs(Math.sin(t * 11 + i)); x.fillStyle = BLUE; rr(140 + i * 13, y + 52 - bb / 2, 7, bb, 4); x.fill(); }
    txt('L’APPELANT', 222, y + 52, 22, BLUE, 800, 'IN', 'left', 2.5);
    lines.forEach((l, i) => txt(l, 140, y + 112 + i * 56, 44, NIGHT, 600, 'IN', 'left'));
    x.restore(); });
}
function chip(t, t0, s, X, Y, out, col = DANGER) {
  const k = back(cl(pr(t, t0, t0 + .4))), a = env(t, t0, out, .2, .3); if (a <= 0) return;
  font(34, 700, 'SG'); const w = x.measureText(s).width + 120;
  alpha(a, () => { x.save(); x.translate(X, Y); x.scale(k, k); x.fillStyle = rgba(col, .16); rr(-w / 2, -38, w, 76, 38); x.fill(); x.strokeStyle = col; x.lineWidth = 3; x.stroke();
    x.fillStyle = col; x.beginPath(); x.arc(-w / 2 + 44, 0, 20, 0, 6.28); x.fill(); txt('!', -w / 2 + 44, 1, 28, WHITE, 700); txt(s, 24, 1, 34, WHITE, 700); x.restore(); });
}

// ---------- glitch (post) ----------
const tmp = document.createElement('canvas'); tmp.width = W; tmp.height = H; const tx = tmp.getContext('2d');
function glitch(t, amt, seed) {
  if (amt <= 0) return; tx.clearRect(0, 0, W, H); tx.drawImage(c, 0, 0);
  const r = mulberry(seed);
  for (let i = 0; i < 14; i++) { const y = r() * H, hh = 10 + r() * 120, off = (r() - .5) * 140 * amt; x.drawImage(tmp, 0, y, W, hh, off, y, W, hh); }
  x.save(); x.globalCompositeOperation = 'lighter'; x.globalAlpha = .2 * amt;
  x.drawImage(tmp, 14 * amt, 0); x.fillStyle = rgba(DANGER, .25 * amt); x.fillRect(0, 0, W, H); x.restore();
}
// film grain + vignette
const grains = Array.from({ length: 4 }, (_, k) => { const g = document.createElement('canvas'); g.width = 270; g.height = 480; const gx = g.getContext('2d'), id = gx.createImageData(270, 480), r = mulberry(k + 9);
  for (let i = 0; i < id.data.length; i += 4) { const v = r() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 20; } gx.putImageData(id, 0, 0); return g; });
function finish(t) {
  x.save(); x.globalCompositeOperation = 'overlay'; x.imageSmoothingEnabled = false; x.drawImage(grains[Math.floor(t * 30) % 4], 0, 0, W, H); x.restore();
  const v = x.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .75); v.addColorStop(0, rgba('#020814', 0)); v.addColorStop(1, rgba('#020814', .6)); x.fillStyle = v; x.fillRect(0, 0, W, H);
}

// ---------- camera ----------
function camAt(t) { // keyframes: t, x, y, zoom
  const K = [[0, 0, 0, 1], [3.5, 0, 0, 1.02], [4.4, 0, 60, 1.08], [10.4, 0, 40, 1.14], [11.2, 0, -40, 1.2], [15.1, 0, 30, 1.16], [15.3, 0, 30, 1.26], [16.6, 0, -260, 1.0], [19.4, 0, -260, 1.0], [20, 0, 0, 1], [26.5, 0, 0, 1], [31.5, 0, 0, 1.0], [35, 0, 0, 1.06]];
  let i = 0; while (i < K.length - 2 && t > K[i + 1][0]) i++;
  const [a, b] = [K[i], K[i + 1]], k = eio(pr(t, a[0], b[0]));
  return { x: lerp(a[1], b[1], k), y: lerp(a[2], b[2], k), z: lerp(a[3], b[3], k) };
}
function withCam(cam, depth, fn) { x.save(); x.translate(W / 2, H / 2); x.scale(1 + (cam.z - 1) * depth, 1 + (cam.z - 1) * depth); x.translate(-W / 2 - cam.x * depth, -H / 2 - cam.y * depth); fn(); x.restore(); }

// ---------- scenes ----------
function renderAt(t) {
  x.setTransform(1, 0, 0, 1, 0, 0); x.globalAlpha = 1; x.filter = 'none';
  const cam = camAt(t); background(t, cam);
  const shake = T.ring.some(r => t > r && t < r + .9) ? Math.sin(t * 95) * 5 : 0;

  // ===== S1 HOOK (0–4) + S2 CALL (4–10.5) + S3 APP (10.5–15.2) : the phone carries the story
  if (t < 20.2) {
    const rise = eo(pr(t, 0, .9));
    const exit = eio(pr(t, 19.4, 20.2));
    withCam(cam, 1, () => alpha(1 - exit, () => {
      phone(t, (tt, w, h) => {
        if (tt < T.accept + .25) scrIncoming(tt, w, h);
        else if (tt < T.app) { scrCall(tt, w, h); if (tt > T.notif) notif(tt, w, T.notif); alpha(eo(pr(tt, T.accept + .25, T.accept + .6)), () => {}); }
        else {
          const lab = tt < T.scramble ? 'Valider' : scramble('AUTORISER', pr(tt, T.scramble, T.scramble + .7), 77 + Math.floor(tt * 12));
          const col = tt < T.scramble ? BLUE : DANGER;
          alpha(eo(pr(tt, T.app, T.app + .35)), () => scrApp(tt, w, h, { label: lab, btnCol: col }));
        }
      }, { s: lerp(.82, 1, rise), dy: (1 - rise) * 700 + exit * 600, dx: shake, tilt: (1 - rise) * .35 + Math.sin(t * .6) * .04 - exit * .5, rot: (1 - rise) * -.08 + exit * .2 });
      // finger cursor over the button (S3)
      const cu = pr(t, T.cursor, T.cursor + 1.1);
      if (cu > 0 && t < T.freeze + .1) { const k = eio(cu), hov = Math.sin(t * 4) * 6;
        const fx = lerp(840, 560, k), fy = lerp(1700, 1310, k) + hov;
        x.fillStyle = rgba(WHITE, .22); x.beginPath(); x.arc(fx, fy, 56 + 6 * Math.sin(t * 6), 0, 6.28); x.fill(); x.strokeStyle = WHITE; x.lineWidth = 4; x.stroke(); }
      // money leaving the phone (S4)
      const m = pr(t, T.money, T.money + 1.8);
      if (m > 0) for (let i = 0; i < 46; i++) { const d = pr(m, i / 70, i / 70 + .45); if (d <= 0 || d >= 1) continue;
        const a = hash(i) * 6.28, sp = 300 + hash(i + 9) * 600, ex = 540 + Math.cos(a) * sp * d * .7, ey = 1310 - d * (600 + hash(i + 3) * 700) + Math.sin(a) * 60;
        alpha((1 - d), () => txt('€', ex, ey, 44 + hash(i + 5) * 40, i % 3 ? LIGHT : DANGER, 700)); }
    }));
  }
  // tap ripples
  for (const [tt, X, Y] of [[T.accept, 643, 1384], [T.tapNotif, 540, 771]]) {
    const k = pr(t, tt, tt + .5); if (k > 0 && k < 1) withCam(cam, 1, () => { x.strokeStyle = rgba(WHITE, 1 - k); x.lineWidth = 6; x.beginPath(); x.arc(X, Y, 30 + 90 * eo(k), 0, 6.28); x.stroke(); });
  }

  // ---- top typography (screen space, Reels-safe y 250–560)
  kinetic('Il ne va rien te voler.', 540, 300, 74, t, T.hook1, WHITE, { out: T.s2 + .1 });
  kinetic('C’est toi qui vas valider.', 540, 400, 74, t, T.hook2, WHITE, { hl: [4], under: true, out: T.s2 + .1 });
  kinetic('Un appel « de ta banque ».', 540, 330, 64, t, T.s2 + .2, WHITE, { hl: [4], out: T.s3 });
  chip(t, T.flag, 'Il te presse', 540, 460, T.s3);
  kinetic('Il te demande de valider…', 540, 270, 64, t, T.notif + .2, WHITE, { out: T.freeze });
  kinetic('…pour « annuler ».', 540, 360, 64, t, T.notif + 1.1, WHITE, { hl: [1, 2], out: T.freeze });
  // bubbles over the phone
  bubble(t, T.b1, 'Bonjour, ici le service fraude de votre banque.', 1180, T.b2 - .05);
  bubble(t, T.b2, 'Un paiement suspect de 1 890 € est en cours.', 1180, T.b3 - .05);
  bubble(t, T.b3, 'Pour l’annuler, validez-le dans votre appli. Vite.', 1180, T.s3 + .3);

  // ===== S4 REVEAL (15.2–20)
  if (t > T.freeze && t < 20.3) {
    const dim = env(t, T.freeze, 20.2, .2, .5); x.fillStyle = rgba('#020814', .62 * dim); x.fillRect(0, 0, W, H);
    // re-draw the magnified button area on top of the dim (focus pull)
    const g1 = env(t, T.scramble - .4, 20.0, .3, .4);
    alpha(g1, () => { txt('VALIDER', 540, 320, 120, rgba(WHITE, .9), 700, 'SG', 'center', 6); const sk = eo(pr(t, T.scramble - .1, T.scramble + .4)); x.fillStyle = DANGER; x.fillRect(540 - 300, 316, 600 * sk, 12); });
    kinetic('= AUTORISER', 540, 450, 110, t, T.valEq, WHITE, { hl: [1], out: 20.0 });
    kinetic('Il n’y a rien à « annuler ».', 540, 570, 52, t, T.valEq + .7, ICE, { w: 600, fam: 'IN', out: 20.0 });
    alpha(env(t, T.money + .4, 20.0, .3, .4), () => { txt('−1 890,00 €', 540, 690, 84, DANGER, 700, 'SG'); txt('partis en un clic', 540, 765, 36, ICE, 600, 'IN'); });
  }

  // ===== S5 RULE (20–26.5)
  if (t > T.s5 - .2 && t < T.s6 + .3) {
    const a = env(t, T.s5 - .1, T.s6 + .2, .4, .45);
    alpha(a, () => {
      const sx = (1 - eo(pr(t, T.s5, T.s5 + .7))) * 60;
      kinetic('Ta banque ne te demandera', 540, 330, 62, t, T.title5, WHITE);
      kinetic('JAMAIS :', 540, 430, 110, t, T.title5 + .35, WHITE, { hl: [0] });
      const items = [[T.x1, 'de valider une opération'], [T.x2, 'un code reçu par SMS'], [T.x3, 'ton mot de passe']];
      items.forEach(([tt, s], i) => { const k = eo(pr(t, tt, tt + .5)); if (k <= 0) return; const y = 640 + i * 175;
        alpha(k, () => { x.save(); x.translate((1 - k) * 120 + sx, 0);
          x.fillStyle = rgba(WHITE, .07); rr(90, y - 70, 900, 140, 36); x.fill(); x.strokeStyle = rgba(LIGHT, .35); x.lineWidth = 2; x.stroke();
          x.fillStyle = rgba(DANGER, .18); x.beginPath(); x.arc(170, y, 44, 0, 6.28); x.fill(); cross(170, y, 18, pr(t, tt + .15, tt + .5), DANGER);
          const ls = wrap(s, 680, 44, 600, 'IN'); ls.forEach((l, j) => txt(l, 245, y + (j - (ls.length - 1) / 2) * 52, 44, WHITE, 600, 'IN', 'left'));
          x.restore(); }); });
      const q = eo(pr(t, T.quote, T.quote + .6));
      alpha(q, () => { x.save(); x.translate(0, (1 - q) * 40);
        const g = x.createLinearGradient(90, 0, 990, 0); g.addColorStop(0, BLUE); g.addColorStop(1, '#1A7BEA'); x.fillStyle = g; rr(90, 1200, 900, 300, 40); x.fill();
        ['Pour bloquer une fraude,', 'elle n’a besoin d’aucune', 'action de ta part.'].forEach((l, j) => txt(l, 540, 1280 + j * 62, 50, WHITE, 700, 'SG'));
        txt('d’après la Banque de France', 540, 1460, 28, rgba(ICE, .8), 600, 'IN', 'center', 1); x.restore(); });
    });
  }

  // ===== S6 REFLEX (26.5–31.5)
  if (t > T.s6 - .3 && t < T.s7 + .3) {
    const a = env(t, T.s6 - .2, T.s7 + .2, .45, .4);
    alpha(a, () => {
      withCam({ x: 0, y: 0, z: 1 }, 1, () => {
        const k = eo(pr(t, T.s6, T.s6 + .8));
        phone(t, (tt, w, h) => scrCall(tt, w, h, tt > T.hang + .25 ? { ended: true } : { hang: T.hang }), { s: .62, dy: 380 + (1 - k) * 500, tilt: Math.sin(t * .7) * .05 });
        const hk = pr(t, T.hang, T.hang + .5); if (hk > 0 && hk < 1) { x.strokeStyle = rgba(WHITE, 1 - hk); x.lineWidth = 6; x.beginPath(); x.arc(540, 1080 + 380 + 324 * .62, 30 + 80 * eo(hk), 0, 6.28); x.stroke(); }
      });
      const step = (tt, n, s1, s2, y) => { const k = eo(pr(t, tt, tt + .5)); if (k <= 0) return;
        alpha(k, () => { x.save(); x.translate(0, (1 - k) * 40);
          x.fillStyle = LIGHT; x.beginPath(); x.arc(150, y, 40, 0, 6.28); x.fill(); txt(n, 150, y + 2, 44, NIGHT, 700);
          txt(s1, 220, y, 62, WHITE, 700, 'SG', 'left'); if (s2) txt(s2, 220, y + 66, 36, rgba(ICE, .85), 400, 'IN', 'left'); x.restore(); }); };
      step(T.r1, '1', 'Raccroche.', 'même si l’appel a l’air sérieux', 300);
      step(T.r2, '2', 'Rappelle ta banque', 'toi-même, avec le numéro de ton appli', 470);
      step(T.r3, '3', 'Déjà validé ?', 'appelle-la et fais opposition tout de suite', 640);
    });
  }

  // ===== S7 END (31.5–35)
  if (t > T.s7 - .2) {
    const a = eo(pr(t, T.s7 - .1, T.s7 + .4));
    alpha(a, () => {
      x.fillStyle = rgba(NIGHT, .55); x.fillRect(0, 0, W, H);
      const k = back(cl(pr(t, T.end1, T.end1 + .6)));
      x.save(); x.translate(540, 760); x.scale(k, k); txt('VALIDER', 0, -90, 132, WHITE, 700, 'SG', 'center', 4); txt('≠', 0, 30, 110, LIGHT, 700); txt('ANNULER', 0, 150, 132, WHITE, 700, 'SG', 'center', 4); x.restore();
      kinetic('Envoie ça à quelqu’un que tu veux protéger.', 540, 1050, 46, t, T.end1 + .7, ICE, { w: 600, fam: 'IN' });
      const lk = pr(t, T.logo, T.logo + 1.0);
      if (lk > 0) { const s = scramble('JIMMY DÉCRYPTE', lk, 5 + Math.floor(t * 15));
        alpha(eo(cl(lk * 3)), () => { x.fillStyle = BLUE; rr(250, 1255, 580, 110, 26); x.fill(); txt(s, 540, 1312, 54, WHITE, 700, 'SG', 'center', 3);
          txt('La cybersécurité, décryptée pour tout le monde.', 540, 1430, 30, rgba(ICE, .8), 400, 'IN');
          txt('Source : Banque de France', 540, 1490, 24, rgba(ICE, .55), 400, 'IN'); }); }
    });
    alpha(1 - ei(pr(t, T.DUR - .5, T.DUR)), () => {});
  }

  // transitions
  for (const s of [T.s2, T.s3, T.s5, T.s6, T.s7]) streaks(t, s);
  flash(t, T.freeze, .25, .4, WHITE);
  if (t > T.freeze && t < T.freeze + .45) glitch(t, 1 - pr(t, T.freeze, T.freeze + .45), 300 + Math.floor(t * 30));
  if (t > T.scramble - .05 && t < T.scramble + .2) glitch(t, .5, 900 + Math.floor(t * 30));
  if (t > 19.95 && t < 20.15) glitch(t, .4, 1200 + Math.floor(t * 30));
  finish(t);
  const fo = pr(t, T.DUR - .4, T.DUR); if (fo > 0) { x.fillStyle = rgba(NIGHT, fo); x.fillRect(0, 0, W, H); }
}

// cover: 1080x1920, key text inside the central 1080x1440 (3:4 grid crop)
function renderCover() {
  x.setTransform(1, 0, 0, 1, 0, 0); background(2, { x: 0, y: 0, z: 1 });
  phone(13.3, (tt, w, h) => scrApp(13.6, w, h, {}), { s: .78, dy: 280, tilt: .12, rot: .06 });
  x.fillStyle = BLUE; rr(350, 270, 380, 70, 18); x.fill(); txt('JIMMY DÉCRYPTE', 540, 306, 34, WHITE, 700, 'SG', 'center', 2);
  txt('« Validez', 540, 470, 118, WHITE, 700); txt('pour annuler »', 540, 595, 118, WHITE, 700);
  x.fillStyle = DANGER; rr(250, 690, 580, 104, 52); x.fill(); txt('C’EST UN PIÈGE', 540, 744, 50, WHITE, 700, 'SG', 'center', 2);
  finish(0);
}

window.ready = Promise.all(['700 10px SG', '500 10px SG', '400 10px IN', '600 10px IN', '800 10px IN'].map(f => document.fonts.load(f))).then(() => {
  const q = new URLSearchParams(location.search);
  if (q.has('cover')) renderCover(); else renderAt(+(q.get('t') || 0));
  if (q.has('play')) { const t0 = performance.now(); const loop = () => { renderAt(((performance.now() - t0) / 1000) % T.DUR); requestAnimationFrame(loop); }; loop(); }
});
